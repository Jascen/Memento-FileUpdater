name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Builds every project in the solution (launcher, server, package signer) and runs all the tests
      - name: Build and test
        run: dotnet test FileUpdater.sln -c Release
