name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build client
        run: dotnet build src/Client -c Release

      - name: Build server
        run: dotnet build src/Server -c Release

      - name: Test client
        run: dotnet test src/Client.Tests -c Release
